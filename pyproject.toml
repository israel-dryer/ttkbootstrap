[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttkbootstrap"
version = "2.2.0"
description = "A supercharged theme extension for tkinter that enables on-demand modern flat style themes inspired by Bootstrap."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND (Apache-2.0 OR BSD-2-Clause)"
authors = [
    { name = "Israel Dryer", email = "israel.dryer@gmail.com" }
]
keywords = [
    "tkinter",
    "theme",
    "ttk",
    "bootstrap",
    "gui",
    "desktop",
    "python3",
    "ui",
    "widgets",
    "theming",
    "cross-platform",
    "modern",
    "responsive",
    "python-gui"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
    "Operating System :: OS Independent",
]

dependencies = ["pillow>=10,<13"]

[project.urls]
Homepage = "https://github.com/israel-dryer/ttkbootstrap"
Documentation = "https://ttkbootstrap.readthedocs.io/en/latest/"

[project.scripts]
# Two names for one command: `ttkbootstrap` is guessable from the package name,
# `ttkb` is what anyone types twice. When the scripts directory is not on PATH,
# `python -m ttkbootstrap.cli <command>` runs the same thing.
ttkbootstrap = "ttkbootstrap.cli:main"
ttkb = "ttkbootstrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# app_icons ships only the two runtime assets built by tools/make_app_ico.py
# (the .ico for Windows, the .png for macOS/Linux). The per-size source PNGs live
# in the repo-root assets/app_icons/ and are build inputs, not shipped.
# py.typed and the generated __init__.pyi are listed explicitly: MANIFEST.in's
# graft already sweeps them in, but the stub is what restores widget parameters
# in an IDE (#1327), so a wheel that quietly ships without it is a silent
# regression rather than a visible failure.
"ttkbootstrap" = ["py.typed", "*.pyi", "themes/*.json", "assets/*", "assets/icons/*", "assets/elements/*", "assets/app_icons/ttkbootstrap.ico", "assets/app_icons/ttkbootstrap.png"]

[tool.pytest.ini_options]
# Only the headless suite under tests/ is collected. Interactive mainloop()
# demos live in examples/ and are not tests.
testpaths = ["tests"]
# Capture output at the Python (sys.stdout/stderr) level, NOT the default
# fd level. The default fd capture replaces OS file descriptors 0/1/2, and on
# Windows that intermittently breaks the Tcl interpreter's file-channel reads --
# surfacing as a flaky `couldn't read file ".../msgs/nl.msg": No error` when
# msgcat lazily sources a Tk-shipped catalog. sys-level capture leaves the OS
# fds the Tcl channels depend on untouched.
addopts = "--capture=sys"
markers = [
    "gui: requires a Tk display (deselect with -m 'not gui')",
]
